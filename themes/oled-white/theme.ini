# OLED theme: true RGB 000000 background turns off black OLED pixels.
# Accent colors remain visible for text, selection and controls.
[info]
name = oled white

[colors]
bg = 000000
accent = 101010
highlight = 202020
text = FFFFFF
text_dim = A6AAB1
progress = FFFFFF
vis_bar = FFFFFF
album_art_bg = 000000
vis_overlay = D9000000
album_art_tint = 00000000

[sizes]
font_large = 32
font_medium = 23
font_small = 19

[layout]
album_art_size = 200
corner_radius = 0
list_row_height = 30
